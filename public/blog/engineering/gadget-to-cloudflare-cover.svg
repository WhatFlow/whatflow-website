<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">WhatFlow: from Gadget to Cloudflare Workers</title>
  <desc id="d">Before: admin UI and data on Gadget, with 13 separate Workers and per-feature queues. After: one Worker per app with D1, Queues, R2 and Hyperdrive, plus a Team Inbox Worker with Durable Objects.</desc>
  <rect width="1200" height="630" fill="#FAF7F0"/>
  <g font-family="Inter, Helvetica, Arial, sans-serif" fill="#000">
    <text x="60" y="78" font-size="40" font-weight="900" letter-spacing="-1">FROM GADGET TO CLOUDFLARE WORKERS</text>
    <text x="60" y="114" font-size="20" font-weight="600" fill="#444">How WhatFlow moved two Shopify apps without a reinstall</text>

    <!-- Before -->
    <text x="60" y="176" font-size="16" font-weight="800" fill="#666" letter-spacing="2">BEFORE</text>
    <rect x="60" y="192" width="470" height="150" rx="16" fill="#fff" stroke="#000" stroke-width="3"/>
    <text x="84" y="232" font-size="22" font-weight="900">Gadget</text>
    <text x="84" y="264" font-size="17" font-weight="600" fill="#333">Admin UI · data models · actions</text>
    <text x="84" y="292" font-size="17" font-weight="600" fill="#333">Shopify sessions · per-shop webhooks</text>
    <rect x="60" y="364" width="470" height="196" rx="16" fill="#fff" stroke="#000" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="84" y="404" font-size="22" font-weight="900">13 separate Workers</text>
    <g fill="#E8E4DA" stroke="#000" stroke-width="2">
      <rect x="84" y="424" width="96" height="40" rx="8"/><rect x="190" y="424" width="96" height="40" rx="8"/><rect x="296" y="424" width="96" height="40" rx="8"/><rect x="402" y="424" width="104" height="40" rx="8"/>
      <rect x="84" y="476" width="96" height="40" rx="8"/><rect x="190" y="476" width="96" height="40" rx="8"/><rect x="296" y="476" width="96" height="40" rx="8"/><rect x="402" y="476" width="104" height="40" rx="8"/>
    </g>
    <g font-size="14" font-weight="700" text-anchor="middle">
      <text x="132" y="449">orders</text><text x="238" y="449">checkouts</text><text x="344" y="449">polls</text><text x="454" y="449">messages</text>
      <text x="132" y="501">drafts</text><text x="238" y="501">flow</text><text x="344" y="501">usage</text><text x="454" y="501">KV sync</text>
    </g>
    <text x="84" y="542" font-size="15" font-weight="600" fill="#555">per-feature queues, settings synced on a schedule</text>

    <!-- Arrow -->
    <g stroke="#000" stroke-width="5" fill="none"><path d="M560 380 H630"/><path d="M614 362 L634 380 L614 398"/></g>

    <!-- After -->
    <text x="664" y="176" font-size="16" font-weight="800" fill="#00A84D" letter-spacing="2">AFTER</text>
    <rect x="664" y="192" width="476" height="236" rx="16" fill="#00D261" stroke="#000" stroke-width="3"/>
    <text x="688" y="232" font-size="22" font-weight="900">One Worker per app</text>
    <text x="688" y="262" font-size="17" font-weight="700">Admin UI · API · webhooks · Flow actions</text>
    <g fill="#fff" stroke="#000" stroke-width="2">
      <rect x="688" y="282" width="128" height="52" rx="10"/><rect x="828" y="282" width="128" height="52" rx="10"/><rect x="968" y="282" width="148" height="52" rx="10"/>
      <rect x="688" y="348" width="128" height="52" rx="10"/><rect x="828" y="348" width="288" height="52" rx="10"/>
    </g>
    <g font-size="17" font-weight="800" text-anchor="middle">
      <text x="752" y="314">D1</text><text x="892" y="314">Queues</text><text x="1042" y="314">R2</text>
      <text x="752" y="380">Cron</text><text x="972" y="380">Hyperdrive → Postgres</text>
    </g>
    <rect x="664" y="452" width="476" height="108" rx="16" fill="#fff" stroke="#000" stroke-width="3"/>
    <text x="688" y="492" font-size="22" font-weight="900">Team Inbox Worker</text>
    <text x="688" y="522" font-size="17" font-weight="600" fill="#333">Durable Objects for real-time chats</text>
    <text x="688" y="546" font-size="17" font-weight="600" fill="#333">Meta webhooks → service binding → app</text>
  </g>
  <text x="60" y="600" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="800">whatflow.tech</text>
</svg>
